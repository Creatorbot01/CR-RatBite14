- type: job
  id: operatorT1
  name: job-name-hecu-operator
  description: job-description-hecu-operator
  playTimeTracker: JobOperator
  setPreference: false
  startingGear: NTInternGear
  icon: "JobIconOperator"
  supervisors: job-supervisors-centcom job-supervisors-hecu-teamLead
  canBeAntag: false
  accessGroups:
  - AAWithoutCommandRoom
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, BluespaceLifelineImplant ] # CC gets bluespace

- type: job
