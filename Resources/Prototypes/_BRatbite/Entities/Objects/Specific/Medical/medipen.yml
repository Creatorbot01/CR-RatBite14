#medipen result for medical assembler. use this one so that we can just balance the mass produceable variant.
#why? to just make it medipen is easier to print since we want 1:1 chem from recipe to medipen.
- type: entity
  parent: BaseItem
  id: EmptyMedipenItem
  name: medipen shell
  description: a shell of a medipen, can be filled with chemicals via medical assembler only. can only use authorized recipes that precoded into the assembler.
  components:
  - type: Item
    sprite: Objects/Specific/Medical/medipen.rsi
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#439822"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#439822"
      - state: base-colorB-inhand-right
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: medipen

- type: entity
  parent: EmergencyMedipen
  id: EmergencyMedipenProduceable
  suffix: Produceable
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15 # Goobstation
        reagents:
        - ReagentId: Epinephrine # Goobstation
          Quantity: 5
        - ReagentId: Atropine # Goobstation
          Quantity: 5
        - ReagentId: TranexamicAcid # Goobstation
          Quantity: 5

