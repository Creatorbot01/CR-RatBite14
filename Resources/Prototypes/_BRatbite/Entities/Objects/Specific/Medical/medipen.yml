- type: entity # since this one is made by medical changes the contraband to SecCommand one. plus you didnt even need antag for this one.
  parent: [ChemicalMedipen, BaseSecurityCommandContraband]
  id: CombatMedipenProduceable
  suffix: Produceable
  name: combat medipen
  description: A single-dose, non-refillable medipen containing a chemical cocktail that treats most forms of damage.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#5bcaca"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#5bcaca"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: morphen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: morphen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 35 # goobstation
        reagents:
        - ReagentId: Omnizine
          Quantity: 30 # goobstation
        - ReagentId: TranexamicAcid
          Quantity: 5
  - type: StaticPrice
    price: 1500

